<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meeting Prep Coach</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background: #0f172a; }
    .fade-in { animation: fadeIn 0.3s ease-in; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const STORAGE_KEY = "meeting-prep-sessions";
    const API_KEY_STORAGE = "meeting-prep-api-key";

    function loadSessions() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch { return []; }
    }

    function saveSessions(sessions) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions.slice(0, 5)));
    }

    function loadApiKey() {
      // Trim on load so any previously-saved key with stray whitespace
      // (very common when pasting from email / password managers into a
      // type="password" input where you can't see the trailing newline)
      // gets cleaned up automatically.
      return (localStorage.getItem(API_KEY_STORAGE) || "").trim();
    }

    function saveApiKey(key) {
      localStorage.setItem(API_KEY_STORAGE, key.trim());
    }

    // ---------- Tool definition for structured output ----------
    // Forcing the model to call this tool guarantees a valid JSON shape,
    // which removes the brittle JSON.parse(text) path and lets us drop the
    // "Respond ONLY with valid JSON" instructions from the system prompt.
    const SUBMIT_QUESTIONS_TOOL = {
      name: "submit_questions",
      description: "Submit 5 to 6 sharp, open-ended coaching questions the user should consider about their meeting.",
      input_schema: {
        type: "object",
        properties: {
          questions: {
            type: "array",
            minItems: 5,
            maxItems: 6,
            items: {
              type: "object",
              properties: {
                question: { type: "string", description: "The coaching question, phrased as an open-ended prompt." },
                context: { type: "string", description: "A brief rationale — why this question matters for this specific meeting." }
              },
              required: ["question", "context"]
            }
          }
        },
        required: ["questions"]
      }
    };

    // Extract fully-formed {question, context} objects from a partial JSON
    // payload produced by a streaming tool_use block. Best-effort: balances
    // braces while respecting string escapes, so we can render questions as
    // they complete instead of waiting for the final message_stop event.
    function extractCompletedQuestions(partialJson) {
      const results = [];
      const idx = partialJson.indexOf("[");
      if (idx === -1) return results;
      const arr = partialJson.slice(idx + 1);

      let depth = 0;
      let start = -1;
      let inString = false;
      let escape = false;

      for (let i = 0; i < arr.length; i++) {
        const c = arr[i];
        if (escape) { escape = false; continue; }
        if (c === "\\") { escape = true; continue; }
        if (c === '"') { inString = !inString; continue; }
        if (inString) continue;
        if (c === "{") {
          if (depth === 0) start = i;
          depth++;
        } else if (c === "}") {
          depth--;
          if (depth === 0 && start !== -1) {
            try {
              const obj = JSON.parse(arr.slice(start, i + 1));
              if (obj && typeof obj.question === "string" && typeof obj.context === "string") {
                results.push(obj);
              }
            } catch {}
            start = -1;
          }
        }
      }
      return results;
    }

    // ---------- Settings Panel ----------
    function SettingsPanel({ apiKey, setApiKey, onClose }) {
      const [draft, setDraft] = useState(apiKey);
      const trimmed = draft.trim();
      const fingerprint = trimmed
        ? `${trimmed.length} chars, starts with “${trimmed.slice(0, 7)}…”`
        : "";
      const hasWhitespace = draft !== trimmed;

      function save() {
        setApiKey(trimmed);
        saveApiKey(trimmed);
        onClose();
      }

      return (
        <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4">
          <div className="bg-slate-800 rounded-2xl p-6 w-full max-w-md shadow-xl border border-slate-700">
            <h2 className="text-xl font-bold text-white mb-4">Settings</h2>
            <label className="block text-sm text-slate-300 mb-2">Anthropic API Key</label>
            <input
              type="password"
              value={draft}
              onChange={e => setDraft(e.target.value)}
              placeholder="sk-ant-..."
              className="w-full bg-slate-900 border border-slate-600 rounded-lg px-4 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 mb-2"
            />
            {fingerprint && (
              <p className="text-xs text-slate-500 mb-2">Will save: {fingerprint}</p>
            )}
            {hasWhitespace && (
              <p className="text-xs text-amber-400 mb-2">Leading/trailing whitespace detected — it will be trimmed on save.</p>
            )}
            <p className="text-xs text-slate-400 mb-6 mt-2">Your key is stored only in this browser's localStorage. It is sent directly to the Anthropic API and nowhere else.</p>
            <div className="flex gap-3 justify-end">
              <button onClick={onClose} className="px-4 py-2 rounded-lg text-slate-300 hover:bg-slate-700 transition">Cancel</button>
              <button
                onClick={save}
                className="px-4 py-2 rounded-lg bg-indigo-600 text-white hover:bg-indigo-500 transition font-medium"
              >Save</button>
            </div>
          </div>
        </div>
      );
    }

    // ---------- Question Card ----------
    function QuestionCard({ index, question, context }) {
      return (
        <div className="fade-in bg-slate-800/80 border border-slate-700 rounded-xl p-5 hover:border-indigo-500/50 transition">
          <div className="flex items-start gap-3">
            <span className="flex-shrink-0 w-8 h-8 rounded-full bg-indigo-600 text-white flex items-center justify-center text-sm font-bold">{index}</span>
            <div>
              <p className="text-white text-base leading-relaxed font-medium">{question}</p>
              <p className="text-slate-400 text-sm mt-2 italic">{context}</p>
            </div>
          </div>
        </div>
      );
    }

    // ---------- History Sidebar ----------
    function HistorySidebar({ sessions, onSelect, onClose }) {
      return (
        <div className="fixed inset-0 bg-black/60 flex justify-end z-50">
          <div className="bg-slate-800 w-full max-w-md h-full overflow-y-auto p-6 border-l border-slate-700 shadow-xl">
            <div className="flex items-center justify-between mb-6">
              <h2 className="text-xl font-bold text-white">Previous Sessions</h2>
              <button onClick={onClose} className="text-slate-400 hover:text-white text-2xl leading-none">&times;</button>
            </div>
            {sessions.length === 0 ? (
              <p className="text-slate-400">No previous sessions yet.</p>
            ) : (
              <div className="space-y-3">
                {sessions.map((s, i) => (
                  <button
                    key={i}
                    onClick={() => { onSelect(s); onClose(); }}
                    className="w-full text-left bg-slate-900 border border-slate-700 rounded-xl p-4 hover:border-indigo-500/50 transition"
                  >
                    <p className="text-sm text-indigo-400 mb-1">{new Date(s.timestamp).toLocaleString()}</p>
                    {s.role && <p className="text-xs text-slate-400 mb-1">Role: {s.role}</p>}
                    <p className="text-slate-300 text-sm line-clamp-2">{s.input.slice(0, 120)}...</p>
                    <p className="text-xs text-slate-500 mt-1">{s.questions.length} questions</p>
                  </button>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    // ---------- About This Build ----------
    function AboutThisBuild() {
      const REPO_NAME = 'week07_meeting_prep';
      const GITHUB_URL = `https://github.com/hayimpapa/${REPO_NAME}`;

      return (
        <div className="max-w-4xl mx-auto px-4 py-8 fade-in">
          <div className="mb-8">
            <h1 className="text-3xl sm:text-4xl font-bold text-white mb-2 tracking-tight">About This Build</h1>
            <p className="text-slate-400 text-sm sm:text-base">
              Week 7 of <strong className="text-white">52 Apps in 52 Weeks Before I Turn 52</strong> by Hey I'm Papa
            </p>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div className="bg-slate-800/80 border border-slate-700 rounded-xl p-5 hover:border-indigo-500/50 transition">
              <h2 className="text-xs font-bold tracking-wider text-indigo-400 uppercase mb-3">The Problem</h2>
              <p className="text-slate-300 text-sm leading-relaxed">
                Meetings often end without clarity because people walk in without having
                pressure-tested the agenda. Hidden assumptions, unspoken risks, blockers and
                misalignments only get noticed in hindsight — or not at all. You need a sparring
                partner who reads the agenda and tells you what you should actually be asking.
              </p>
            </div>

            <div className="bg-slate-800/80 border border-slate-700 rounded-xl p-5 hover:border-indigo-500/50 transition">
              <h2 className="text-xs font-bold tracking-wider text-indigo-400 uppercase mb-3">The App</h2>
              <p className="text-slate-300 text-sm leading-relaxed">
                Meeting Prep Coach is a single-file React app. Paste an agenda or meeting minutes
                and Claude returns 5–6 sharp, open-ended coaching questions tailored to that
                content. Built with React 18, Tailwind CSS and Babel Standalone via CDN — no build
                step — calling the Anthropic Messages API with streaming and tool use for
                structured output, with sessions stored in localStorage.
              </p>
            </div>

            <div className="bg-slate-800/80 border border-slate-700 rounded-xl p-5 hover:border-indigo-500/50 transition sm:col-span-2">
              <h2 className="text-xs font-bold tracking-wider text-indigo-400 uppercase mb-3">GitHub Repo</h2>
              <p className="text-slate-300 text-sm leading-relaxed mb-4">
                All the code for this app lives on GitHub. Fork it, read it, break it.
              </p>
              <a
                href={GITHUB_URL}
                target="_blank"
                rel="noopener noreferrer"
                className="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-green-600 text-white font-medium hover:bg-green-500 transition"
              >
                <svg className="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.73.5.5 5.73.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56 0-.27-.01-1-.02-1.96-3.2.7-3.88-1.54-3.88-1.54-.52-1.33-1.28-1.68-1.28-1.68-1.05-.72.08-.71.08-.71 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.28 1.19-3.08-.12-.3-.52-1.47.11-3.06 0 0 .97-.31 3.18 1.18a11 11 0 015.79 0c2.21-1.49 3.18-1.18 3.18-1.18.63 1.59.23 2.76.11 3.06.74.8 1.19 1.82 1.19 3.08 0 4.42-2.69 5.4-5.26 5.68.41.36.77 1.06.77 2.14 0 1.54-.01 2.78-.01 3.16 0 .31.21.68.8.56A10.52 10.52 0 0023.5 12C23.5 5.73 18.27.5 12 .5z"/></svg>
                View on GitHub
              </a>
            </div>
          </div>
        </div>
      );
    }

    // ---------- Main App ----------
    function App() {
      const [activeTab, setActiveTab] = useState("app");
      const [apiKey, setApiKey] = useState(loadApiKey);
      const [showSettings, setShowSettings] = useState(false);
      const [showHistory, setShowHistory] = useState(false);
      const [input, setInput] = useState("");
      const [role, setRole] = useState("");
      const [questions, setQuestions] = useState([]);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState("");
      const [copied, setCopied] = useState(false);
      const [sessions, setSessions] = useState(loadSessions);

      async function analyse() {
        if (!apiKey) { setShowSettings(true); return; }
        if (!input.trim()) { setError("Please paste a meeting agenda or minutes."); return; }

        setError("");
        setLoading(true);
        setQuestions([]);

        const systemPromptText = "You are a seasoned agile delivery coach and consultant. Your job is to read a meeting agenda or meeting minutes and generate 5 to 6 sharp, open-ended coaching questions the user should consider asking or reflecting on. Focus on uncovering hidden risks, assumptions, blockers, or misalignments. Avoid generic questions. Make them specific to the content provided. Always call the submit_questions tool to return your questions.";

        const userMsg = `${role ? `My role: ${role}\n\n` : ""}Here is the meeting content:\n\n${input}`;

        try {
          const res = await fetch("https://api.anthropic.com/v1/messages", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-api-key": apiKey,
              "anthropic-version": "2023-06-01",
              "anthropic-dangerous-direct-browser-access": "true"
            },
            body: JSON.stringify({
              model: "claude-sonnet-4-6",
              max_tokens: 1500,
              // Structured `system` block so we can attach cache_control.
              // Anthropic will only actually cache once the cached prefix
              // exceeds the minimum token threshold; for short prompts this
              // is a no-op today but future-proofs the call.
              system: [
                { type: "text", text: systemPromptText, cache_control: { type: "ephemeral" } }
              ],
              tools: [SUBMIT_QUESTIONS_TOOL],
              tool_choice: { type: "tool", name: "submit_questions" },
              messages: [{ role: "user", content: userMsg }],
              stream: true
            })
          });

          if (!res.ok) {
            const body = await res.json().catch(() => ({}));
            const rawMsg = body.error?.message || `API error ${res.status}`;
            const hint = res.status === 401
              ? " — open Settings and re-paste your key (watch for trailing whitespace or a missing character)."
              : "";
            throw new Error(rawMsg + hint);
          }

          const reader = res.body.getReader();
          const decoder = new TextDecoder();
          let buffer = "";
          let partialJson = "";
          let streamed = [];
          let finalQuestions = null;

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });

            // SSE events are separated by a blank line.
            let sep;
            while ((sep = buffer.indexOf("\n\n")) !== -1) {
              const rawEvent = buffer.slice(0, sep);
              buffer = buffer.slice(sep + 2);

              let dataLine = "";
              for (const line of rawEvent.split("\n")) {
                if (line.startsWith("data: ")) dataLine += line.slice(6);
              }
              if (!dataLine) continue;

              let evt;
              try { evt = JSON.parse(dataLine); } catch { continue; }

              if (evt.type === "content_block_delta" && evt.delta?.type === "input_json_delta") {
                partialJson += evt.delta.partial_json || "";
                const completed = extractCompletedQuestions(partialJson);
                if (completed.length > streamed.length) {
                  streamed = completed;
                  setQuestions([...completed]);
                }
              } else if (evt.type === "message_stop") {
                try {
                  const obj = JSON.parse(partialJson);
                  if (Array.isArray(obj?.questions)) finalQuestions = obj.questions;
                } catch {
                  // Fall back to whatever the progressive parser captured.
                }
              } else if (evt.type === "error") {
                throw new Error(evt.error?.message || "Stream error");
              }
            }
          }

          const resolved = finalQuestions || streamed;
          if (!resolved.length) throw new Error("No questions were returned. Please try again.");
          setQuestions(resolved);

          const session = { timestamp: Date.now(), input, role, questions: resolved };
          const updated = [session, ...sessions].slice(0, 5);
          setSessions(updated);
          saveSessions(updated);
        } catch (e) {
          setError(e.message || "Something went wrong.");
        } finally {
          setLoading(false);
        }
      }

      function copyAll() {
        const text = questions.map((q, i) => `${i + 1}. ${q.question}\n   Why it matters: ${q.context}`).join("\n\n");
        navigator.clipboard.writeText(text).then(() => {
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
        });
      }

      function selectSession(s) {
        setInput(s.input);
        setRole(s.role || "");
        setQuestions(s.questions);
      }

      return (
        <div className="min-h-screen text-white flex flex-col">
          {showSettings && <SettingsPanel apiKey={apiKey} setApiKey={setApiKey} onClose={() => setShowSettings(false)} />}
          {showHistory && <HistorySidebar sessions={sessions} onSelect={selectSession} onClose={() => setShowHistory(false)} />}

          {/* Top Nav Bar — 52-apps branding + tabs */}
          <nav className="sticky top-0 z-50 bg-slate-950/90 backdrop-blur border-b border-slate-800">
            <div className="max-w-4xl mx-auto px-3 sm:px-4 py-2 flex items-center justify-between gap-2">
              <a
                href="https://52-app.com/"
                target="_blank"
                rel="noopener noreferrer"
                title="52 Apps in 52 Weeks"
                className="flex-shrink-0 p-1 hover:opacity-75 transition-opacity"
              >
                <img
                  src="https://raw.githubusercontent.com/hayimpapa/week00-main-page/main/public/w52.png"
                  alt="52 Apps Logo"
                  style={{ height: "34px", borderRadius: "6px" }}
                  className="w-auto block"
                />
              </a>
              <div className="flex gap-1 sm:gap-2" role="tablist">
                <button
                  role="tab"
                  aria-selected={activeTab === "app"}
                  onClick={() => setActiveTab("app")}
                  className={`px-2.5 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-medium transition border-b-2 ${
                    activeTab === "app"
                      ? "bg-slate-800 text-white border-indigo-500"
                      : "text-slate-300 hover:bg-slate-800/60 border-transparent"
                  }`}
                >
                  Meeting Prep Coach
                </button>
                <button
                  role="tab"
                  aria-selected={activeTab === "about"}
                  onClick={() => setActiveTab("about")}
                  className={`px-2.5 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-medium transition border-b-2 ${
                    activeTab === "about"
                      ? "bg-slate-800 text-white border-indigo-500"
                      : "text-slate-300 hover:bg-slate-800/60 border-transparent"
                  }`}
                >
                  About This Build
                </button>
              </div>
            </div>
          </nav>

          {activeTab === "about" && (
            <div className="flex-1 w-full overflow-auto">
              <AboutThisBuild />
            </div>
          )}

          {activeTab === "app" && (
          <div className="flex-1 w-full overflow-auto">
          {/* Header */}
          <header className="border-b border-slate-800 bg-slate-900/80 backdrop-blur">
            <div className="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-9 h-9 rounded-lg bg-indigo-600 flex items-center justify-center text-lg font-bold">M</div>
                <h1 className="text-xl font-bold tracking-tight">Meeting Prep Coach</h1>
              </div>
              <div className="flex gap-2">
                <button onClick={() => setShowHistory(true)} className="px-3 py-2 rounded-lg text-sm text-slate-300 hover:bg-slate-800 transition" title="Previous sessions">
                  History{sessions.length > 0 && <span className="ml-1 text-xs bg-slate-700 px-1.5 py-0.5 rounded-full">{sessions.length}</span>}
                </button>
                <button onClick={() => setShowSettings(true)} className="px-3 py-2 rounded-lg text-sm text-slate-300 hover:bg-slate-800 transition">
                  {apiKey ? "API Key Set" : "Set API Key"}
                </button>
              </div>
            </div>
          </header>

          {/* Main */}
          <main className="max-w-4xl mx-auto px-4 py-8">
            <div className="mb-8">
              <p className="text-slate-400 text-sm mb-6">Paste a meeting agenda or minutes. Get sharp coaching questions to help you prepare.</p>

              <div className="flex gap-4 mb-4">
                <div className="flex-1">
                  <label className="block text-xs text-slate-400 mb-1.5 uppercase tracking-wider">Your Role (optional)</label>
                  <input
                    value={role}
                    onChange={e => setRole(e.target.value)}
                    placeholder="e.g. delivery lead, consultant, observer"
                    className="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm"
                  />
                </div>
              </div>

              <label className="block text-xs text-slate-400 mb-1.5 uppercase tracking-wider">Meeting Agenda / Minutes</label>
              <textarea
                value={input}
                onChange={e => setInput(e.target.value)}
                rows={10}
                placeholder="Paste your meeting agenda or minutes here..."
                className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm leading-relaxed resize-y"
              />

              <div className="flex items-center gap-4 mt-4">
                <button
                  onClick={analyse}
                  disabled={loading}
                  className="px-6 py-2.5 rounded-xl bg-indigo-600 text-white font-medium hover:bg-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed transition flex items-center gap-2"
                >
                  {loading ? (
                    <>
                      <svg className="animate-spin h-4 w-4" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" fill="none" /><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z" /></svg>
                      Analysing...
                    </>
                  ) : "Analyse"}
                </button>
                {error && <p className="text-red-400 text-sm">{error}</p>}
              </div>
            </div>

            {/* Results */}
            {questions.length > 0 && (
              <div>
                <div className="flex items-center justify-between mb-4">
                  <h2 className="text-lg font-semibold">Coaching Questions</h2>
                  <button
                    onClick={copyAll}
                    className="px-4 py-2 rounded-lg text-sm border border-slate-600 text-slate-300 hover:bg-slate-800 transition flex items-center gap-2"
                  >
                    {copied ? (
                      <><svg className="w-4 h-4 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" /></svg> Copied!</>
                    ) : (
                      <><svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" /></svg> Copy All Questions</>
                    )}
                  </button>
                </div>
                <div className="space-y-3">
                  {questions.map((q, i) => (
                    <QuestionCard key={i} index={i + 1} question={q.question} context={q.context} />
                  ))}
                </div>
              </div>
            )}
          </main>
          </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
